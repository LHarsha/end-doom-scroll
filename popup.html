<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; width: 280px; font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; background: #fff8f3; color: #2b1d1a; }
  header { display: flex; align-items: center; gap: 10px; padding: 14px 16px 10px; }
  header svg { width: 42px; height: 42px; }
  h1 { font-size: 16px; margin: 0; }
  header p { margin: 0; opacity: .65; font-size: 12px; }
  .stat { margin: 0 16px 12px; padding: 10px 12px; background: #ffe4d4; border-radius: 10px; }
  .stat b { font-size: 20px; }
  form { padding: 0 16px 16px; display: grid; gap: 10px; }
  label { display: grid; gap: 4px; font-weight: 600; }
  label.row { display: flex; align-items: center; justify-content: space-between; }
  input[type=number], input[type=url] { font: inherit; padding: 6px 8px; border: 1px solid #e8cbb8; border-radius: 8px; background: #fff; }
  .hint { font-weight: 400; opacity: .6; font-size: 11.5px; }
  .saved { color: #3e9c4c; font-size: 12px; height: 14px; }
</style>
</head>
<body>
  <header>
    <svg viewBox="0 0 100 100" aria-hidden="true">
      <path d="M50 30 C50 22 52 16 56 12 M50 28 C44 20 36 20 33 24 C38 28 45 29 50 28 M52 22 C58 15 66 15 69 19 C64 24 57 24 52 22" fill="#5cc46b" stroke="#3e9c4c" stroke-width="2.4" stroke-linecap="round"/>
      <ellipse cx="50" cy="60" rx="38" ry="31" fill="#ff8a5b"/>
      <ellipse cx="50" cy="70" rx="22" ry="15" fill="#ffc6a3"/>
      <ellipse cx="38" cy="55" rx="9" ry="10" fill="#fff"/><ellipse cx="62" cy="55" rx="9" ry="10" fill="#fff"/>
      <circle cx="38" cy="57" r="4.6" fill="#2b1d1a"/><circle cx="62" cy="57" r="4.6" fill="#2b1d1a"/>
      <path d="M44 72 Q50 77 56 72" fill="none" stroke="#2b1d1a" stroke-width="2.6" stroke-linecap="round"/>
    </svg>
    <div><h1>Mochi</h1><p>watching your feeds so you don't have to</p></div>
  </header>
  <div class="stat">Tabs closed today: <b id="closed">0</b></div>
  <form id="f">
    <label class="row">Enabled <input type="checkbox" id="enabled"></label>
    <label>Minutes of scrolling allowed <input type="number" id="minutes" min="0.25" max="120" step="0.25"></label>
    <label>Swipes allowed <span class="hint">each scroll burst counts as one</span><input type="number" id="swipes" min="3" max="1000" step="1"></label>
    <label>Instead of closing, go to <span class="hint">leave empty to just close the tab</span><input type="url" id="replaceUrl" placeholder="https://docs.google.com"></label>
    <div class="saved" id="saved"></div>
  </form>
  <script src="popup.js"></script>
</body>
</html>
